# Workflow for building and deploying a Next.js site to GitHub Pages
# Custom domain: https://luare-consulting.com
#
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
        # NOTE: Do NOT set static_site_generator: next here.
        # That option auto-injects basePath=/test-luare-web which breaks the custom domain.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Localize static HTML language (English/Chinese)
        run: node scripts/fix-static-locale-lang.mjs
      - name: Write CNAME for custom domain
        # GitHub Pages requires a CNAME file in the published root for custom domains.
        # This runs after `next build` so it writes into the ./out directory.
        run: echo "luare-consulting.com" > ./out/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for public route catalog)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify live published pages and privacy links (GET only)
        run: node scripts/verify-live-public-pages.mjs
      - name: Install Chromium for read-only desktop/mobile QA
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test deployed navigation, images, font and layout (no form POST)
        run: node scripts/verify-live-responsive.mjs
      - name: Save PC/mobile screenshots and audit details
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-live-site-qa
          path: qa-artifacts/final-site/
          retention-days: 7
          if-no-files-found: warn
